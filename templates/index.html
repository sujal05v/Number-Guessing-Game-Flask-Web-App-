<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎮 Guess The Number</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1f1f3a;
            padding: 35px;
            border-radius: 15px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,255,255,0.3);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px #00ffff; }
            to { box-shadow: 0 0 30px #ff00ff; }
        }

        h1 {
            margin-bottom: 10px;
        }

        p.tagline {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, #00f5a0, #00d9f5);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .chances {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .emoji {
            font-size: 30px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="emoji">🎯</div>
    <h1>Guess The Number</h1>
    <p class="tagline">Can you beat the system? 😏</p>

    <form method="post" action="/guess">
        <input type="number" name="user_input" placeholder="Enter 1 - 100" required>
        <button type="submit">🔥 Guess</button>
    </form>

    {% if result %}
        <div class="result">
            {{ result }}
        </div>
    {% endif %}

    {% if chances is not none %}
        <div class="chances">
            ❤️ Chances left: {{ chances }}
        </div>
    {% endif %}
</div>

</body>
</html>
